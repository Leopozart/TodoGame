<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TodoGame</title>
	<link href="style.css" type="text/css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body id="light-theme">
	<div class="popup">
		<h2 id="achievement-title">Achievement</h2>
		<img id="achievement-image" src="" alt="achievement image" width="80px"/>
		<p id="achievement-description">Achievement description</p>
		<button id="close">Close</button>
	</div>
	<div light-btns>
		<button class="light-btn" id="light-mode">light-mode</button>
		<button class="light-btn" id="dark-mode">dark-mode</button>
	</div>
	<main class="main" id="light-main">
		<section>
			<div class="achievements" id="light-colors">
				<h2>Achievements</h2>
				<ul id="badges"></ul>
			</div>
		</section>
		<div class="todo-list" id="light-colors">
			<h1 id="logo">TodoGame</h1>
			<h2 id="slogan">Gamify life</h2>
			<form>
				<input type="text" id="new-item" placeholder="Todo item...">
				<select name="difficulty" id="difficulty">
					<option value="0">Difficulty</option>
					<option value="1">Easy</option>
					<option value="2">Not So Easy</option>
					<option value="3">Medium</option>
					<option value="4">Quite Difficult</option>
					<option value="5">Hard</option>
				</select>
				<button class="light-btn" id="add-btn">Add item</button>
			</form>
			
			<ul id="items"></ul>
		</div>
		<div class="stats" id="light-colors">
			<h2>Stats</h2>
			<ul>
				<h2>Elo: <strong class="elo">0</strong></h2>
				<h2>Level: <strong class="level">0</strong></h2>
				<p>tasks completed:<strong id="tasks-completed"></strong></p>
			</ul>
		</div>
	</main>
	
	<script src="http://code.jquery.com/jquery-1.12.0.min.js"></script>
	<script src="http://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
	<script src="script.js"></script>
  </body>
</html>
